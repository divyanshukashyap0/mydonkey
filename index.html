  <script>
    (function() {
      // Helper to show modern in-app security notice
      function showSecurityToast(blockedUrl) {
        try {
          var existing = document.getElementById('adshield-security-toast');
          if (existing) existing.remove();
          var toast = document.createElement('div');
          toast.id = 'adshield-security-toast';
          toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999999;background:rgba(20,20,20,0.95);backdrop-filter:blur(16px);border:1px solid rgba(229,9,20,0.45);border-radius:12px;padding:10px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,0.8),0 0 16px rgba(229,9,20,0.25);color:#fff;font-family:system-ui,-apple-system,sans-serif;font-size:12px;font-weight:600;pointer-events:none;transition:opacity 0.3s ease;';
          toast.innerHTML = '<span style="color:#ef4444;font-size:15px;line-height:1;">🛡️</span><span><strong>Security Shield:</strong> External redirect blocked. Staying safely on My Donkey.</span>';
          document.body.appendChild(toast);
          setTimeout(function() {
            if (toast && toast.parentNode) {
              toast.style.opacity = '0';
              setTimeout(function() { if (toast.parentNode) toast.remove(); }, 350);
            }
          }, 3200);
        } catch (e) {}
      }

      // Safe Destination Checker
      var isSafeDestination = function(href) {
        if (!href) return true;
        var trimmed = String(href).trim().toLowerCase();
        // Allow internal router, hashes, relative paths, javascript:; or blob/data URIs
        if (trimmed.startsWith('/') || trimmed.startsWith('#') || trimmed.startsWith('./') || trimmed.startsWith('../') || trimmed === '' || trimmed === 'javascript:void(0)' || trimmed === 'javascript:;') return true;
        if (trimmed.startsWith('blob:') || trimmed.startsWith('data:')) return true;
        
        try {
          var u = new URL(href, window.location.href);
          // Same origin is always allowed
          if (u.origin === window.location.origin) return true;

          // Safe Google Drive file downloads
          if (u.hostname.includes('drive.google.com') && (u.search.includes('export=download') || u.pathname.includes('/uc'))) {
            return true;
          }
        } catch (e) {
          return false;
        }
        return false;
      };

      // 1. Strict Window.open & showModalDialog Lockdown: Never open new tabs/windows
      var blockOpen = function(url, target, features) {
        console.warn('[AdShield] Blocked window.open attempt to open another tab:', url);
        if (url && !isSafeDestination(url)) {
          showSecurityToast(url);
        }
        return null;
      };
      try {
        window.open = blockOpen;
        Object.defineProperty(window, 'open', {
          value: blockOpen,
          writable: false,
          configurable: false
        });
      } catch (e) {}
      try { window.showModalDialog = function() { return null; }; } catch (e) {}

      // 2. Lock target="_blank" permanently to _self
      try {
        var origSetAttribute = Element.prototype.setAttribute;
        Element.prototype.setAttribute = function(name, value) {
          if (typeof name === 'string' && name.toLowerCase() === 'target') {
            return origSetAttribute.call(this, name, '_self');
          }
          return origSetAttribute.apply(this, arguments);
        };
      } catch (e) {}

      try {
        Object.defineProperty(HTMLAnchorElement.prototype, 'target', {
          get: function() { return this.getAttribute('target') || '_self'; },
          set: function(val) { this.setAttribute('target', '_self'); },
          configurable: true
        });
        Object.defineProperty(HTMLFormElement.prototype, 'target', {
          get: function() { return this.getAttribute('target') || '_self'; },
          set: function(val) { this.setAttribute('target', '_self'); },
          configurable: true
        });
      } catch (e) {}

      // 3. Navigation API Interceptor (W3C standard for modern Chrome / Edge):
      // Intercepts ALL top-level navigations from any source (including iframe frame-busting)
      if (typeof window !== 'undefined' && window.navigation && typeof window.navigation.addEventListener === 'function') {
        window.navigation.addEventListener('navigate', function(e) {
          try {
            if (!e.destination || !e.destination.url) return;
            if (!isSafeDestination(e.destination.url)) {
              console.warn('[AdShield] Navigation API blocked top-level external redirect to:', e.destination.url);
              if (typeof e.preventDefault === 'function') {
                e.preventDefault();
              }
              showSecurityToast(e.destination.url);
            }
          } catch (err) {}
        });
      }

      // 4. Capture-Phase Global Click Interceptor:
      // Stops any link from navigating to external/malicious websites or spawning new tabs
      window.addEventListener('click', function(e) {
        // Suppress Ctrl+Click / Cmd+Click / Shift+Click to force single-page behavior
        if (e.ctrlKey || e.metaKey || e.shiftKey) {
          var checkEl = e.target;
          while (checkEl && checkEl !== document.documentElement) {
            if (checkEl.tagName === 'A') {
              e.preventDefault();
              e.stopPropagation();
              e.stopImmediatePropagation();
              break;
            }
            checkEl = checkEl.parentElement;
          }
        }

        var el = e.target;
        while (el && el !== document.documentElement) {
          if (el.tagName === 'A') {
            var href = el.getAttribute('href') || el.href || '';
            el.setAttribute('target', '_self');
            el.target = '_self';

            // If destination is external / untrusted
            if (!isSafeDestination(href)) {
              console.warn('[AdShield] Blocked click navigation to external website:', href);
              e.preventDefault();
              e.stopPropagation();
              e.stopImmediatePropagation();
              showSecurityToast(href);
              return false;
            }
          }
          el = el.parentElement;
        }
      }, true);

      // 5. Global AuxClick (Middle-Click) Interceptor: Disallow opening links in new tabs via middle-click
      window.addEventListener('auxclick', function(e) {
        if (e.button === 1) { // Middle click
          var el = e.target;
          while (el && el !== document.documentElement) {
            if (el.tagName === 'A') {
              console.warn('[AdShield] Suppressed middle-click attempt to open new tab');
              e.preventDefault();
              e.stopPropagation();
              e.stopImmediatePropagation();
              return false;
            }
            el = el.parentElement;
          }
        }
      }, true);

      // 6. Programmatic Click Interceptor on dynamically generated anchors
      try {
        var origAnchorClick = HTMLAnchorElement.prototype.click;
        HTMLAnchorElement.prototype.click = function() {
          var href = this.getAttribute('href') || this.href || '';
          this.setAttribute('target', '_self');
          this.target = '_self';

          if (!isSafeDestination(href)) {
            console.warn('[AdShield] Blocked programmatic external redirect to:', href);
            showSecurityToast(href);
            return;
          }
          return origAnchorClick.apply(this, arguments);
        };
      } catch (e) {}

      // 7. Form Submission Interceptor: Prevent rogue form redirects to external sites
      try {
        var origFormSubmit = HTMLFormElement.prototype.submit;
        HTMLFormElement.prototype.submit = function() {
          var action = this.getAttribute('action') || this.action || '';
          if (!isSafeDestination(action)) {
            console.warn('[AdShield] Blocked programmatic form redirect to:', action);
            showSecurityToast(action);
            return;
          }
          return origFormSubmit.apply(this, arguments);
        };
      } catch (e) {}

      window.addEventListener('submit', function(e) {
        var target = e.target;
        if (target && target.tagName === 'FORM') {
          var action = target.getAttribute('action') || target.action || '';
          if (!isSafeDestination(action)) {
            console.warn('[AdShield] Blocked external form submission to:', action);
            e.preventDefault();
            e.stopPropagation();
            showSecurityToast(action);
            return false;
          }
        }
      }, true);

      // 8. Focus Recovery: Popunder defense
      window.addEventListener('blur', function() {
        setTimeout(function() {
          try { window.focus(); } catch (e) {}
        }, 80);
      });
    })();
